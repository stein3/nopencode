name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build webui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('webui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build webui
        working-directory: webui
        env:
          WEBUI_BASE: /
        run: npm ci && npm run build

      # vite-plugin-svelte prints its a11y warnings to stdout and still exits 0,
      # so `npm run build` alone never fails on them. Re-running the build with
      # the cache cold is cheap (~6s) and the grep is the only thing standing
      # between an a11y regression and a green check.
      - name: Fail on svelte a11y warnings
        working-directory: webui
        env:
          WEBUI_BASE: /
        run: |
          npx vite build 2>&1 | tee /tmp/a11y-build.log
          if grep -E 'A11y:' /tmp/a11y-build.log; then
            echo '::error::svelte reported accessibility warnings (see above)'
            exit 1
          fi

      - name: Upload webui dist
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          retention-days: 1

  # The test matrix is generated from the directory on purpose: a hand-maintained
  # list silently stops gating the day someone adds a test file (42 of 51 were
  # gated when this was written). Every *.test.mjs in e2e/embedded/ becomes a job.
  list-tests:
    name: Build test matrix
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.ls.outputs.tests }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enumerate e2e/embedded/*.test.mjs
        id: ls
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("e2e/embedded")
              .filter((f) => f.endsWith(".test.mjs"))
              .sort()
              .map((f) => ({ name: f.replace(/\.test\.mjs$/, ""), file: f }));
            if (!files.length) { console.error("no tests found"); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "tests=" + JSON.stringify(files) + "\n");
          '

  test:
    name: "${{ matrix.name }}"
    needs: [build, list-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list-tests.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download webui dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright-core install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: node e2e/embedded/${{ matrix.file }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.name }}
          path: e2e/shots/
          if-no-files-found: ignore
          retention-days: 7
