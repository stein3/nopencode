services:
  opencode-tui:
    image: nopencode:latest
    container_name: opencode-tui
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/app/start.sh"]
    command:
      - "-W"
      - "-i"
      - "0.0.0.0"
      - "-p"
      - "7681"
      - "sh"
      - "-c"
      - "tmux new-session -A -s main 'tmux set-option -s escape-time 0; tmux set -g allow-passthrough on; opencode'"
    ports:
      - "7681:7681"
    volumes:
      - opencode-data:/home/node/.config/opencode
      - ${HOST_WORKSPACE}:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  opencode-data: