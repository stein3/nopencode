  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  # 2. On-Demand Interactive CLI Service
  opencode-cli:
    image: nopencode:latest
    container_name: opencode-cli
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    # Default entrypoint ["opencode"] runs interactive CLI
    # command: opencode
    # command: attach http://opencode-server:4096
    volumes:
      - opencode-data:/home/node/.config/opencode

    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  opencode-data: